name: PMF tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -c constraints/py310-tested.txt -e .
      - run: python -m unittest discover -s tests -v
      - run: python scripts/train_pmf.py --help
