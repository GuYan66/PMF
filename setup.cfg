[metadata]
name = MMSA
version = 2.2.1+pmf.1
author = THUIAR
maintainer = FlameSky, Columbine21
description = MMSA with the PMF polarity and magnitude baseline
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/thuiar/MMSA
keywords = multimodal, sentiment analysis, mosi, mosei
project_urls =
    Documentation = https://github.com/thuiar/MMSA/
    Tracker = https://github.com/thuiar/MMSA/issues
classifiers =
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent

[options]
package_dir =
    = src
packages = find:
include_package_data = True
python_requires = >=3.10
install_requires = 
    torch >= 2.4, < 2.5
    transformers >= 4.46, < 4.47
    numpy >= 1.20.3
    pandas >= 1.2.5
    tqdm >= 4.62.2
    nvidia-ml-py3 >= 7.352.0
    scikit-learn >= 0.24.2
    easydict >= 1.9
    pytorch_transformers == 1.2.0
    einops >= 0.8, < 0.9

[options.packages.find]
where = src